services:
  bazos_hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bazos_hunter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
